  <body>
        <form method="">
      <p>fill you details</p>
      <br />

      <input id="email" type="email" placeholder="enter your mail id" />
      <p class="email-warning warn"> enter a valid email</p>
      <br />
      <select>
        <option value="gender">male</option>
        <option value="gender">female</option>
        <option value="gender">they</option></select
      ><br />
      <textarea
        id="personIntro"
        placeholder=" tell me something about you"
      ></textarea
      ><br />
      <input id="submit" type="submit" /><br />
    </form>
    <script src="index.js"></script>
  </body>
